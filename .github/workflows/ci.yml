name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Valores públicos (van al navegador de todas formas). Los secretos, nunca aquí.
      NEXT_PUBLIC_SITIO_URL: http://localhost:3100
      NEXT_PUBLIC_SUPABASE_URL: https://iewlsyvdkxzcncrbhpyx.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_NtQf6huN9R8YatNzN9uksA_cfT0wSKE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright
          path: test-results/
          retention-days: 7
